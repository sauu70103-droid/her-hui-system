<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>她薈 HER HUI - 會員系統</title>
    <link rel="stylesheet" href="style.css">
    <!-- 🌟 強制清除快取標籤 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
</head>
<body style="background-color: #F8F5EF; margin: 0; padding: 0; font-family: 'Microsoft JhengHei', sans-serif;">

    <!-- Logo 區塊 -->
    <div style="text-align: center; margin-top: 40px; margin-bottom: 20px;">
        <img src="logo.jpg" alt="她薈 HER HUI" style="width: 120px; border-radius: 20px; box-shadow: 0 10px 20px rgba(191,154,90,0.3);">
    </div>
    
    <!-- 頂部導覽列按鈕 (預設隱藏，登入後由 JS 控制顯示) -->
    <div id="top-nav" class="hidden" style="text-align: center; margin-bottom: 30px;">
        <button id="btn-member-area" class="btn-primary" style="background-color: #1B2744; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; margin-right: 10px;">會員專區</button>
        <button id="btn-admin-area" class="btn-secondary" style="background-color: #BF9A5A; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold;">管理員專區</button>
    </div>

    <!-- 🌟 系統連線載入畫面 -->
    <div id="loading-overlay" style="text-align: center; margin: 30px 0;">
        <button style="background: #445677; color: white; border: none; padding: 12px 25px; border-radius: 30px; font-size: 1rem; box-shadow: 0 4px 15px rgba(27,39,68,0.3);">
            系統安全連線中... ⏳
        </button>
    </div>

    <!-- 🌟 主程式渲染區 (絕對不能刪除) -->
    <div id="app-content" style="max-width: 600px; margin: 0 auto; padding: 0 20px 40px;"></div>

    <!-- 外部模組載入 (嚴格遵守依賴順序) -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="JS/cardManager.js"></script>
    <script src="JS/config.js"></script>
    <script src="JS/utils.js"></script>
    <script src="JS/uploader.js"></script>
    <script src="JS/member.js"></script>
    <script src="JS/admin.js"></script>
</body>
</html>
